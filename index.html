<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="艺体美求职资格自查：填完一张表，看清自己哪些硬门槛过得了、还缺哪张凭证、手上的公告能不能报。">
<style>
:root{color-scheme:light dark}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>资格自查台</title>
<style>
:root{
  --paper:#E8ECEE; --surface:#FFFFFF; --sunk:#F2F5F6; --field:#FBFCFC;
  --rule:#C6D0D5; --rule-soft:#E0E7EA;
  --ink:#111A1F; --body:#3A464D; --mute:#74838B;
  --indigo:#1B4D6B; --indigo-bg:#E2EDF2;
  --pass:#1D6448; --pass-bg:#E2F0E9;
  --fail:#A32F25; --fail-bg:#F8E6E3;
  --hold:#835B12; --hold-bg:#F8EFDA;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",STSong,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1316; --surface:#161D21; --sunk:#12181B; --field:#1A2226;
    --rule:#293439; --rule-soft:#1E272B;
    --ink:#E7EDEF; --body:#B2BFC5; --mute:#7A8991;
    --indigo:#82B6D2; --indigo-bg:#10252F;
    --pass:#5CBE93; --pass-bg:#0E2620;
    --fail:#E9857A; --fail-bg:#2A1513;
    --hold:#D6AC57; --hold-bg:#281F0F;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1316; --surface:#161D21; --sunk:#12181B; --field:#1A2226;
  --rule:#293439; --rule-soft:#1E272B;
  --ink:#E7EDEF; --body:#B2BFC5; --mute:#7A8991;
  --indigo:#82B6D2; --indigo-bg:#10252F;
  --pass:#5CBE93; --pass-bg:#0E2620;
  --fail:#E9857A; --fail-bg:#2A1513;
  --hold:#D6AC57; --hold-bg:#281F0F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.shell{max-width:1180px;margin:0 auto;padding:34px 20px 80px}

/* ── 抬头 ───────────────────────────────── */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:8px}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--indigo);
  text-transform:uppercase;margin:0 0 9px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(27px,4.4vw,38px);
  margin:0 0 10px;color:var(--ink);letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.lede{margin:0;font-size:15px;max-width:60ch}
.lede b{color:var(--ink);font-weight:700}

/* ── 主栅格 ──────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:26px;align-items:start;margin-top:4px}
/* 必须 minmax(0,1fr)：单纯写 1fr 时轨道最小宽度是 auto，
   会被里面最宽的内容撑破，整页横向滚动 */
@media(max-width:880px){.grid{grid-template-columns:minmax(0,1fr);gap:0}
  .side{order:-1;margin:0 0 18px}}   /* 结论摆在表格前面，手机上才看得见 */

/* ── 学科选择 ─────────────────────────────── */
.discbar{display:flex;gap:0;border:1px solid var(--rule);border-radius:5px;overflow:hidden;
  background:var(--surface);margin:20px 0 7px}
.discbar button{flex:1 1 0;min-width:0;appearance:none;border:0;border-right:1px solid var(--rule);
  background:transparent;font:500 14px/1 var(--sans);color:var(--body);padding:12px 6px;
  cursor:pointer;transition:background .12s}
.discbar button:last-child{border-right:0}
.discbar button:hover{background:var(--sunk)}
.discbar button[aria-pressed=true]{background:var(--indigo);color:#fff;font-weight:700}
.discbar button:focus-visible{outline:2px solid var(--indigo);outline-offset:-3px}
.verified{font-size:12.5px;color:var(--mute);margin:0 0 16px;display:flex;gap:7px;
  align-items:baseline;flex-wrap:wrap}
.verified .vb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 6px;
  border-radius:3px;flex:none;font-weight:600}
.vb.real{background:var(--pass-bg);color:var(--pass)}
.vb.desk{background:var(--hold-bg);color:var(--hold)}

/* ── 表单分组 ─────────────────────────────── */
.group{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:baseline;gap:11px;padding:13px 17px;background:var(--sunk);
  border-bottom:1px solid var(--rule)}
.gkey{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--indigo);
  border-radius:3px;padding:1px 7px;flex:none}
.gname{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink)}
.gwhy{font-size:12.5px;color:var(--mute);margin-left:auto;text-align:right}
.ghead{flex-wrap:wrap}
@media(max-width:560px){.gwhy{margin-left:0;text-align:left;flex-basis:100%}}
.gbody{padding:16px 17px}

/* 字段 */
.fields{display:grid;gap:13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
@media(max-width:620px){.f2,.f3{grid-template-columns:1fr}}
label{display:block}
.lb{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:4px}
.lb .req{color:var(--fail);font-weight:700}
input,select,textarea{width:100%;font:400 14px/1.55 var(--sans);color:var(--ink);
  background:var(--field);border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px;
  border-color:var(--indigo)}
textarea{resize:vertical;min-height:58px}
input.mono{font-family:var(--mono);letter-spacing:.04em}
/* 追问提示 —— 这套工具的灵魂：字段旁边那一句 */
.probe{font-size:12px;line-height:1.6;color:var(--indigo);margin:5px 0 0;
  padding-left:11px;border-left:2px solid var(--indigo-bg)}
.probe b{font-weight:600}
.fh{display:block;font-size:12px;line-height:1.55;color:var(--mute);margin-top:4px}
.fh b{color:var(--body);font-weight:600}

/* 校徽 */
.logo-row{display:flex;gap:13px;align-items:flex-start;padding:12px 13px;
  background:var(--sunk);border:1px solid var(--rule-soft);border-radius:5px}
.logo-pv{width:56px;height:56px;object-fit:contain;flex:none;background:var(--surface);
  border:1px solid var(--rule-soft);border-radius:4px}
.logo-pv.empty{display:flex;align-items:center;justify-content:center;font-size:11px;
  color:var(--mute);border-style:dashed}
.logo-txt{min-width:0;flex:1}
.logo-hint{margin:2px 0 8px;font-size:12px;line-height:1.6;color:var(--mute)}
.logo-btns{display:flex;gap:7px;flex-wrap:wrap}
.logo-btn{display:inline-block;appearance:none;border:1px solid var(--indigo);background:transparent;
  color:var(--indigo);font:600 12.5px/1 var(--sans);padding:7px 12px;border-radius:4px;cursor:pointer}
.logo-btn:hover{background:var(--indigo-bg)}
.logo-btn.ghost{border-color:var(--rule);color:var(--mute)}
.logo-btn.ghost:hover{background:var(--sunk);color:var(--fail);border-color:var(--fail)}

/* 资产行 */
.rows{display:grid;gap:11px}
.row{border:1px solid var(--rule-soft);border-radius:5px;padding:12px 13px;background:var(--sunk)}
.rowtop{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rowtop .n{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:none}
.del{margin-left:auto;appearance:none;border:1px solid var(--rule);background:var(--surface);
  color:var(--mute);font:400 12px/1 var(--sans);padding:5px 9px;border-radius:4px;cursor:pointer}
.del:hover{color:var(--fail);border-color:var(--fail)}
.add{appearance:none;border:1px dashed var(--rule);background:transparent;color:var(--indigo);
  font:500 13px/1 var(--sans);padding:10px;border-radius:5px;cursor:pointer;width:100%;margin-top:11px}
.add:hover{background:var(--indigo-bg);border-style:solid}

/* 粘贴公告识别 */
.paste{border:1px dashed var(--indigo);border-radius:5px;padding:12px 13px;margin-bottom:12px;background:var(--indigo-bg)}
.paste textarea{min-height:92px;font-size:13px;background:var(--surface)}
.paste-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.btn-sm{appearance:none;border:1px solid var(--indigo);background:var(--indigo);color:#fff;font:600 13px/1 var(--sans);
  padding:9px 14px;border-radius:4px;cursor:pointer}
.btn-sm:hover{filter:brightness(1.12)}
.parse-msg{font-size:12.5px;color:var(--indigo)}
.auto{display:inline-block;margin-left:5px;font:600 10px/1 var(--mono);letter-spacing:.04em;color:var(--hold);
  background:var(--hold-bg);border:1px solid var(--hold);border-radius:3px;padding:2px 4px;vertical-align:1px}
.src{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;
  font-size:12.5px;line-height:1.65}
.src p{margin:0 0 4px}
.src-h b{color:var(--ink)}
.src-m{color:var(--hold)}
.src .link{appearance:none;border:0;background:none;color:var(--indigo);font:600 12.5px/1 var(--sans);
  padding:0 0 0 8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.src details{margin-top:6px}
.src summary{cursor:pointer;color:var(--indigo);font-size:12px}
.src pre{white-space:pre-wrap;word-break:break-all;font:12px/1.6 var(--sans);color:var(--mute);background:var(--sunk);
  padding:8px 10px;border-radius:4px;margin:6px 0 0;max-height:220px;overflow:auto}

/* 岗位判定 */
.verdict{margin-top:11px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--rule-soft);border-radius:5px}
.verdict>b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:7px}
.vr{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:12.5px;line-height:1.6;
  padding:3px 0;align-items:start}
.vr .mark{font-size:10.5px;padding:1px 5px}

/* 行内警告 */
.flag{display:flex;gap:8px;font-size:12.5px;line-height:1.62;margin-top:9px;padding:9px 11px;
  border-radius:4px;align-items:flex-start}
.flag .mk{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  flex:none;padding:1px 5px;border-radius:2px;margin-top:2px}
.flag.warn{background:var(--hold-bg);color:var(--hold)}
.flag.warn .mk{background:var(--hold);color:var(--surface)}
.flag.bad{background:var(--fail-bg);color:var(--fail)}
.flag.bad .mk{background:var(--fail);color:var(--surface)}
.flag.info{background:var(--indigo-bg);color:var(--indigo)}
.flag.info .mk{background:var(--indigo);color:#fff}
.flag b{font-weight:700}

/* ── 侧栏 ───────────────────────────────── */
.side{position:sticky;top:18px;display:grid;gap:13px}
@media(max-width:880px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.ptitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);padding:11px 15px 0}
.tally{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--rule-soft);margin-top:11px}
.t{background:var(--surface);padding:12px 6px;text-align:center}
.t b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.t small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.t.ok b{color:var(--pass)} .t.no b{color:var(--fail)} .t.hd b{color:var(--hold)}
.req-body{padding:8px 15px 14px}
.req-n{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--fail)}
.req-ok{margin:0;font-size:13px;font-weight:600;color:var(--pass)}
.req-l{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.req-l li{font-size:12.5px;color:var(--body);padding-left:11px;position:relative}
.req-l li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--fail)}
.rq{color:var(--fail);font-weight:700}
.gates{padding:4px 15px 14px}
.gate{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--rule-soft);font-size:13px;line-height:1.55;align-items:start}
.gate:last-child{border-bottom:0}
.mark{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;
  flex:none;margin-top:1px;white-space:nowrap}
.mark.p{background:var(--pass-bg);color:var(--pass)}
.mark.f{background:var(--fail-bg);color:var(--fail)}
.mark.h{background:var(--hold-bg);color:var(--hold)}
.mark.i{background:var(--sunk);color:var(--mute);border:1px solid var(--rule-soft)}
.mark.b{background:transparent;color:var(--mute);border:1px dashed var(--rule)}
.gate .gt{color:var(--ink);font-weight:500}
.gate .gn{color:var(--mute);font-size:12px;display:block;margin-top:1px;line-height:1.5}

.act{display:grid;gap:8px;padding:14px 15px}
.btn{appearance:none;border:1px solid var(--indigo);background:var(--indigo);color:#fff;
  font:600 14px/1 var(--sans);padding:11px;border-radius:4px;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.ghost:hover{background:var(--indigo-bg);filter:none}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.blocked{margin:0;font-size:11.5px;line-height:1.62;color:var(--fail);
  background:var(--fail-bg);border-radius:4px;padding:9px 11px}
.blocked b{font-weight:700}
.blocked button{appearance:none;border:1px solid var(--fail);background:transparent;
  color:var(--fail);font:600 11.5px/1 var(--sans);padding:6px 9px;border-radius:3px;
  cursor:pointer;margin-top:7px}
.blocked button:hover{background:var(--fail);color:var(--surface)}
#fallback{margin-top:4px;min-height:150px;font-family:var(--mono);font-size:11px}
.exp-note{margin:-2px 0 2px;font-size:11.5px;line-height:1.6;color:var(--hold)}
.privacy{font-size:11.5px;line-height:1.65;color:var(--mute);padding:0 15px 14px}

/* 预览层 */
.ovl{position:fixed;inset:0;z-index:99;background:var(--paper);display:flex;flex-direction:column}
.ovl-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.ovl-t{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);margin-right:auto}
.ovl-b{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--body);
  font:600 13px/1 var(--sans);padding:9px 13px;border-radius:4px;cursor:pointer;white-space:nowrap}
.ovl-b:hover{border-color:var(--indigo);color:var(--indigo)}
.ovl-b.main{background:var(--indigo);border-color:var(--indigo);color:#fff}
.ovl-b.main:hover{filter:brightness(1.12);color:#fff}
.ovl-tip{margin:0;padding:8px 14px;font-size:12px;line-height:1.6;color:var(--mute);
  background:var(--sunk);border-bottom:1px solid var(--rule-soft)}
.ovl-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);
  display:flex;justify-content:center}
.ovl-box{position:relative;overflow:hidden;background:#fff}
.ovl-fr{display:block;border:0;background:#fff}
.ovl-img{display:none;width:100%;max-width:794px;padding-bottom:28px}
.ovl-img img{display:block;width:100%;height:auto;background:#fff;-webkit-touch-callout:default}
.ovl.showimg .ovl-box{position:absolute;left:-10000px;top:0}
.ovl.showimg .ovl-img{display:block}
.ovl-bad{color:var(--fail)}
.ovl-b:disabled{opacity:.6;cursor:default}
@media print{body>*:not(.ovl){display:none!important}
  .ovl{position:static}.ovl-bar,.ovl-tip{display:none!important}
  .ovl-body{overflow:visible;display:block}
  .ovl-box{width:auto!important;height:auto!important;overflow:visible}
  .ovl-fr{transform:none!important;width:100%!important}}

/* ── 结论表 ──────────────────────────────── */
.report{margin-top:30px;background:var(--surface);border:1px solid var(--ink);border-radius:6px;
  overflow:hidden}
.rhead{padding:16px 20px;border-bottom:2px solid var(--ink);display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.rhead h2{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);margin:0}
.rhead .meta{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto}
.rsec{padding:16px 20px;border-bottom:1px solid var(--rule-soft)}
.rsec:last-child{border-bottom:0}
.rsec h3{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 3px;
  display:flex;align-items:center;gap:8px}
.rsec h3 .cnt{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--mute)}
.rsec .rnote{font-size:12.5px;color:var(--mute);margin:0 0 11px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);font-weight:400;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}
td .sub{display:block;font-size:12px;color:var(--mute);line-height:1.5;margin-top:2px}
.empty{font-size:13px;color:var(--mute);font-style:normal;padding:4px 0}
.finding{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--rule-soft);font-size:13.5px;line-height:1.6;align-items:start}
.finding:last-child{border-bottom:0}
.sev{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:3px;
  flex:none;margin-top:2px;white-space:nowrap}
.sev.s3{background:var(--fail-bg);color:var(--fail)}
.sev.s2{background:var(--hold-bg);color:var(--hold)}
.sev.s1{background:var(--indigo-bg);color:var(--indigo)}
.finding .cat{font-family:var(--mono);font-size:11px;color:var(--mute);margin-right:5px}

.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--mute);line-height:1.8}
.foot b{color:var(--ink)}
.exbanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;min-width:0;
  background:var(--hold-bg);color:var(--hold);border:1px solid var(--hold);
  border-radius:5px;padding:10px 14px;margin-bottom:16px}
.exbanner b{font-weight:700}
.exbanner button{margin-left:auto;flex:none;appearance:none;border:1px solid var(--hold);
  background:transparent;color:var(--hold);font:600 12.5px/1 var(--sans);
  padding:7px 12px;border-radius:4px;cursor:pointer}
.exbanner button:hover{background:var(--hold);color:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <div class="masthead">
    <p class="stamp">资格审查 · 自查用</p>
    <h1>资格自查台</h1>
    <p class="lede">按下面几组填完，得到两样东西：<b>哪些条件你已经满足</b>、<b>还要补哪张凭证</b>。带 <span class="rq">※</span> 的必填，少一项就判不出结论。</p>
  </div>

  <div class="discbar" id="discbar" role="group" aria-label="选择专业方向"></div>
  <p class="verified" id="verified"></p>

  <div class="exbanner" id="exbanner">
    <b>当前是示例数据</b><span>填的是一位虚构的体育生，让你先看清这张表怎么用、会查出什么。</span>
    <button type="button" id="clearAll">清空，填我自己的</button>
  </div>

  <div class="grid">
    <div>

/* ═══════════════ 核查 ═══════════════ */
function audit(){
  var f=[], D=DISC[S.discipline];

  // 师范类：师范院校 ≠ 师范类专业
  if(S.edu.normal==="不确定" && S.edu.school)
    f.push({s:2,c:"硬门槛",t:"<b>去教务处确认你的专业算不算师范类。</b>不少教师岗写明「本科专业须为师范类」，而师范院校 ≠ 师范类专业。"});
  if(S.edu.normal==="否")
    f.push({s:2,c:"硬门槛",t:"<b>今后每份公告都逐字找「本科专业须为师范类」这句。</b>你的专业非师范类，写了这句的岗位报不了。"});
  if(S.edu.code && !/^[A-Z]\d{4,6}$/i.test(S.edu.code.trim()))
    f.push({s:1,c:"硬门槛",t:"<b>去成绩单或教务处核准专业代码</b>（形如 B040202）。代码直接决定能不能报名。"});

  // 证书
  S.creds.forEach(function(c,i){
    if(!c.name) return;
    FAKES.forEach(function(k){ if(k.re.test(c.name))
      f.push({s:3,c:"硬门槛",t:"<b>把「"+esc(c.name)+"」从资质栏撤下来。</b>"+k.msg}); });
    if(c.cat==="艺术考级")
      f.push({s:2,c:"硬门槛",t:"<b>「"+esc(c.name)+"」不要放在显要位置。</b>社会艺术水平考级在求职中近乎无效力，可写但不作核心资质。"});
    if(c.status==="部分完成"&&!c.note)
      f.push({s:3,c:"措辞风险",t:"<b>补上「"+esc(c.name)+"」卡在哪一步。</b>资格复审按实际进度算，不按「已通过」。"});
    if(c.cat==="教师资格"&&c.status==="部分完成")
      f.push({s:3,c:"资格时效",t:"<b>去查已过科目的通过时间。</b>教资笔试单科成绩有效期 2 年，报面试时三科须同时有效，过期要重考。"});
    if(c.status==="已取得"&&c.proof==="暂无凭证")
      f.push({s:2,c:"凭证缺失",t:"<b>确认「"+esc(c.name)+"」原件在谁手里、补办要多久。</b>资格复审要交原件。"});
  });

  // 成绩
  var windy=[];
  S.achs.forEach(function(a,i){
    if(!a.title) return;
    var w=parseFloat(String(a.wind).replace("+",""));
    if(!isNaN(w)&&w>2.0){
      windy.push(a);
      f.push({s:3,c:"技术条件",t:"<b>简历里「"+esc(a.title)+"」只写名次，不写成绩。</b>风速 "+esc(a.wind)+" m/s 超过 +2.0，不能用于等级认定。"});
    }
    if(a.nature==="展演展示"&&a.rank&&a.rank!=="参演")
      f.push({s:3,c:"措辞风险",t:"<b>「"+esc(a.title)+"」的名次改填「参演」。</b>展演不产生名次，写成获奖是错的。"});
    if(a.proof==="暂无凭证")
      f.push({s:2,c:"凭证缺失",t:"<b>找主办方要「"+esc(a.title)+"」的成绩册或证书。</b>"});
  });
  // 成绩与证书达标成绩交叉
  windy.forEach(function(a){
    S.creds.forEach(function(c){
      if(c.qeMark && String(a.mark).indexOf(c.qeMark)<0)
        f.push({s:3,c:"跨材料冲突",t:"<b>定下 "+esc(a.mark)+" 和 "+esc(c.qeMark)+" 哪个写进简历。</b>两个数指向同一场赛事，而两份材料会一起交到同一个人手里。"});
    });
  });

  // 经历
  var hasPro=false;
  S.exps.forEach(function(e){
    if(!e.org) return;
    if(["省级以上专业运动队","职业俱乐部运动队","地市级以上体校"].indexOf(e.nature)>=0) hasPro=true;

  });
  var withOrg=S.exps.filter(function(e){return e.org;});

  if(S.discipline==="sports" && !hasPro && withOrg.length && withOrg.every(function(e){return e.nature;}))
    f.push({s:2,c:"硬门槛",t:"<b>以「专业运动队训练经历」为门槛的岗位不要投。</b>你填的单位都是商业机构或学校，这类经历不被认定。"});

  // 技能
  S.skills.forEach(function(k){
    if(k.ev==="自述掌握"&&k.d)
      f.push({s:1,c:"措辞风险",t:"<b>简历里「"+esc(k.d)+"」写「可承担普及性教学」，不要暗示专业水平。</b>面试有专项模拟实训，当场要示范。"});
  });

  // 学位
  if(S.edu.degree==="无学位")
    f.push({s:2,c:"硬门槛",t:"<b>要求「学历学位双证」的岗位报不了。</b>今后每份公告都看清学位要求。"});
  if(S.edu.degree==="预计取得（应届）")
    f.push({s:1,c:"资格时效",t:"<b>看清公告是否允许报名时还没拿到学位证。</b>应届生通常毕业时才取得，有的岗位要求限期提交。"});

  // 学术

    if(!r.title) return;
    if(r.status==="已宣讲"&&r.attended==="未到场")
      f.push({s:3,c:"跨材料冲突",t:"<b>「"+esc(r.title)+"」你没到场，状态不能写「已宣讲」。</b>改成「已录用」，形式照实写。"});
    if(r.status==="投稿中"||r.status==="已录用"||r.status==="已收录")
      f.push({s:1,c:"措辞风险",t:"<b>简历里「"+esc(r.title)+"」写「"+esc(r.status)+"」，不要写「发表」。</b>「发表」一般指已经见刊。"});
    if(r.proof==="暂无凭证")
      f.push({s:2,c:"凭证缺失",t:"<b>去找「"+esc(r.title)+"」的录用通知或收录页。</b>"});
  });

  // 作品集
  if(D.portfolio.gateRole==="报名必备" && S.works.length
     && !S.works.some(function(w){return w.title;}))
    f.push({s:3,c:"凭证缺失",t:"<b>补一份作品或演示：</b>"+esc(D.portfolio.format)+"。本专业属报名必备，缺了很多岗位报不了。"});

  f.sort(function(a,b){return b.s-a.s;});
  return f;
}


/* 校徽要存进 localStorage，而它总共只有 5MB 上下。
   注意 canvas 重编码不一定变小：校徽多是带抗锯齿边缘的图形，
   PNG 压不动，再加 base64 的 33% 开销，结果常常比原图还大。
   所以逐级缩小到达标为止，并且原图本来就够小就直接用原图。 */
var LOGO_CAP = 90000;   // dataURL 字符数上限

function fitLogo(img, cb){
  var sizes=[256,192,144,108,80], best=null;
  for(var i=0;i<sizes.length;i++){
    var max=sizes[i], k=Math.min(1,max/Math.max(img.width,img.height));
    var cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(img.width*k));
    cv.height=Math.max(1,Math.round(img.height*k));
    var cx=cv.getContext("2d");
    cx.imageSmoothingQuality="high";
    cx.drawImage(img,0,0,cv.width,cv.height);
    var url=cv.toDataURL("image/png");
    if(best===null||url.length<best.length) best=url;
    if(url.length<=LOGO_CAP){ cb(url); return; }
  }
  cb(best);
}

document.addEventListener("change",function(e){
  if(e.target.id!=="logoFile") return;
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var raw=rd.result;                       // 原图的 dataURL
    var im=new Image();
    im.onload=function(){
      fitLogo(im,function(url){
        // 缩完反而更大就用原图——这种情况在小尺寸优化过的 PNG 上很常见
        S.edu.logo = (raw.length<=url.length && raw.length<=LOGO_CAP*2) ? raw : url;
        S.isExample=false;
        renderAll();
        if(!logoStored()){
          S.edu.logo="";
          renderAll();
          var h=document.querySelector(".logo-hint");
          if(h){ h.innerHTML='<b style="color:var(--fail)">这张图太大，浏览器存不下。</b>'+
                 '换一张小一点的，或先把它缩到 200px 以内。'; }
        }
      });
    };
    im.onerror=function(){
      var h=document.querySelector(".logo-hint");
      if(h) h.innerHTML='<b style="color:var(--fail)">这个文件读不出来。</b>换 PNG 或 JPG 试试。';
    };
    im.src=raw;
  };
  rd.readAsDataURL(f);
});

/* 硬门槛判定 */
function gates(){
  return DISC[S.discipline].gates.map(function(g){
    var st="hold", why="";
    if(g.k.indexOf("cred:")===0){
      var cat=g.k.slice(5);
      var any=S.creds.filter(function(c){return c.name;}).length;
      var hit=S.creds.filter(function(c){return c.cat===cat && c.name;});
      // "还没填"和"没有这张证"是两回事。一张表还空着就报不满足，
      // 会让刚打开的人以为自己根本没资格——那不是结论，是没问过。
      if(!any){ st="blank"; why="还没填证书"; }
      else if(!hit.length && S.creds.some(function(c){return c.name&&!c.cat;})){
        st="hold"; why="有证书还没选类别，选完才能判断"; }
      else if(!hit.length){ st = g.eff==="硬门槛" ? "fail" : "none";
        why = g.eff==="硬门槛" ? "没有这一类证书" : "没有，但这一项不是必需"; }
      else{
        var got=hit.filter(function(c){return c.status==="已取得";});
        if(got.length){ st="pass"; why=got.map(function(c){return c.level||c.name;}).join("、"); }
        else{ st="hold"; why=hit[0].status ? hit[0].status+(hit[0].note?"："+hit[0].note:"") : "还没选状态"; }
      }
      if(g.eff==="仅参考"&&hit.length){ st="hold"; why="效力有限，不作核心资质"; }
    } else if(g.k==="portfolio"){
      var w=S.works.filter(function(x){return x.title;});
      if(w.length){ st="pass"; why=w.length+" 件已登记"; }
      else{ st="fail"; why="一件都没有"; }
    } else { st = g.eff==="硬门槛" ? "hold" : "none"; why="需对照公告自行核对"; }
    if(st==="hold" && g.eff!=="硬门槛") st="none";
    return {t:g.t,eff:g.eff,n:g.n,st:st,why:why,hard:g.eff==="硬门槛"};
  });
}

/*<notice-parser>*/
/* 公告识别：把公告原文或岗位表里的条件拆成岗位对照的各项。
   只做「照原文抽取」，拿不准的一律留给用户核对，不替用户认定。
   要在老款手机上跑，所以不用反向断言等新正则语法。 */
var NoticeParser=(function(){
  var SPORTS="田径|篮球|足球|排球|网球|武术|羽毛球|乒乓球|游泳|体操|跳绳|健美操|啦啦操|跆拳道|毽球|橄榄球|棒球|垒球|手球|曲棍球|击剑|射击|举重|摔跤|柔道|拳击|攀岩|滑冰|滑雪|定向越野|轮滑";
  var STAGE={"小学":"小学","初中":"初中","初级中学":"初中","高中":"高中","高级中学":"高中","中职":"中职","中等职业学校":"中职"};
  var HEAD={name:/岗位名称|招聘岗位|^岗位$/, unit:/招聘单位|用人单位|单位|学校/, code:/岗位(代码|编码)|^代码$|^编码$/,
            count:/人数|拟聘|计划/, edu:/学历/, degree:/学位/, majors:/专业/, age:/年龄/, other:/其他|条件|备注|要求|说明/};

  /* 全角字母数字转半角：有的公告把 B0402 打成 Ｂ０４０２ */
  function half(s){ return String(s||"").replace(/[０-９Ａ-Ｚａ-ｚ]/g,
    function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); }); }

  function sentences(t){
    return t.split(/[。；;\n]+/).map(function(x){
      return x.replace(/^\s*(?:其他条件|其他要求|其他|备注|条件|要求|说明)\s*[：:]\s*/,"")
              .replace(/^\s*[\d一二三四五六七八九十]+\s*[.、．)）]\s*/,"").trim();
    }).filter(Boolean);
  }

  /* 从 Excel 复制出来的岗位表：制表符分隔，第一行是表头 */
  function splitRows(t){
    var lines=t.split(/\r?\n/).filter(function(l){ return l.replace(/\s/g,""); });
    if(lines.length<2 || lines[0].indexOf("\t")<0) return null;
    var head=lines[0].split("\t").map(function(x){ return x.trim(); }), map={}, hits=0;
    head.forEach(function(h,k){ for(var key in HEAD){ if(!(key in map) && HEAD[key].test(h)){ map[key]=k; hits++; break; } } });
    if(hits<2) return null;
    return lines.slice(1).map(function(l){
      var c=l.split("\t"), cells={}, parts=[];
      head.forEach(function(h,k){
        var v=(c[k]||"").trim(); if(!v) return;
        parts.push(h+"："+v);
        for(var key in map){ if(map[key]===k) cells[key]=v; }
      });
      return {text:parts.join("；"), cells:cells};
    }).filter(function(r){ return r.text; });
  }

  function parseOne(raw, cells){
    cells=cells||{};
    var t=half(raw).replace(/\t/g,"；"), S=sentences(t), out={auto:[], notes:[]};
    var plain=S.filter(function(s){ return !/放宽/.test(s); });   // 放宽条款是替代条件，不当主条件读
    function set(k,v){ if(v!=null && v!==""){ out[k]=v; if(out.auto.indexOf(k)<0) out.auto.push(k); } }
    function sentOf(re){ for(var i=0;i<S.length;i++){ if(re.test(S[i])) return S[i]; } return ""; }
    function firstIn(list,re){ for(var i=0;i<list.length;i++){ var m=list[i].match(re); if(m) return m; } return null; }

    // 岗位名称
    var name=cells.name||"", m;
    if(!name && (m=t.match(/(?:岗位名称|招聘岗位|岗位)\s*[：:]\s*([^\s，,。；;|（(]{2,24}(?:[（(][^）)]{1,12}[）)])?)/))) name=m[1];
    if(!name && (m=t.match(/([一-龥]{0,8}(?:小学|初中|高中|中学|中职)?[一-龥]{0,2}(?:体育与健康|体育|田径|篮球|足球|排球|游泳|武术)[一-龥]{0,3}(?:教师|教练员|教练)(?!资格)(?:[（(][^）)]{1,12}[）)])?\d?)/))) name=m[1];
    var code=cells.code || ((m=t.match(/\b([A-Z]{2}\d{7}[A-Z]\d{4})\b/)) ? m[1] : "");
    var full=(cells.unit ? cells.unit+" " : "")+name;
    if(code) full=full ? full+"（"+code+"）" : code;
    set("name", full.trim());
    if((m=(cells.unit||name).match(/([一-龥]{2,4}?(?:市|区|县))/))) set("city", m[1]);

    // 学历
    var em=firstIn(plain,/(博士研究生|博士|硕士研究生|硕士|研究生|全日制本科|大学本科|本科|大学专科|大专|专科)\s*(?:[（(]含[）)])?\s*(?:及以上|以上)?\s*学历/)
        || firstIn(plain,/学历\s*[：:]?\s*(?:要求\s*[：:]?)?\s*(博士|硕士|研究生|本科|大专|专科)/)
        || firstIn(plain,/^(博士|硕士|研究生|本科|大专|专科)(?:[（(]含[）)])?(?:及以上|以上)?$/);
    if(em){ var e=em[1]; set("edu", /博士/.test(e)?"博士":/硕士|研究生/.test(e)?"硕士及以上":/本科/.test(e)?"本科及以上":"专科及以上"); }

    // 学位
    var pj=plain.join("；");
    if(!/学位不限|不限学位|不要求学位/.test(t) &&
       (/学士\s*(?:[（(]含[）)])?\s*(?:及以上|以上)?\s*学位|硕士\s*(?:[（(]含[）)])?\s*(?:及以上|以上)?\s*学位|取得相应学位|具有相应学位|具有学位|学历学位|学位证|学位\s*[：:]\s*(?:学士|硕士|博士)/.test(pj)
        || plain.some(function(s){ return /^(学士|硕士|博士)(?:及以上|以上)?(?:学位)?$/.test(s); })))
      set("degreeReq","要求学位");

    // 师范类
    if(!/非师范类[^。；;]{0,6}(?:均可|不限)|师范类[、和及与]非师范类|不限师范/.test(t) &&
       /师范类专业|须为师范类|师范类毕业生|公费师范生/.test(t)) set("normalReq","要求");

    // 政治面貌：「党员优先」不是门槛
    if((m=t.match(/中共(?:预备)?党员[^。；;，,]{0,8}/)) && !/优先/.test(m[0])){
      set("partyReq","中共党员");
      if(/含预备党员/.test(t)) out.notes.push("公告写明「含预备党员」");
    }

    // 户籍 / 生源：只标有限制，原句给用户自己判断
    // 「非本地户籍的须本科以上学历」是按户籍分学历，不是限户籍
    var hs="", hcond="";
    for(var hi=0;hi<S.length;hi++){
      if(!/户籍|生源/.test(S[hi])) continue;
      if(/非[\u4e00-\u9fa5]{0,8}(?:户籍|生源)[^。；;]{0,24}(?:学历|学位)/.test(S[hi])){ if(!hcond) hcond=S[hi]; continue; }
      hs=S[hi]; break;
    }
    if(hcond) out.notes.push("学历要求因户籍而不同，原文：「"+hcond+"」");
    if(hs && !/(?:户籍|生源)[^。；;]{0,4}不限|不限[^。；;]{0,4}(?:户籍|生源)/.test(hs)){
      set("hukouReq","有限制"); out.notes.push("户籍 / 生源条款原文：「"+hs+"」");
    }

    // 年龄
    var tiers={}, tn=0, tre=/(本科|研究生|硕士|博士)[^。；;]{0,24}?(\d{2})\s*周岁\s*(?:及|以)?以下/g, tmm;
    while((tmm=tre.exec(t))){ var lvl=tmm[1]==="研究生"?"硕士":tmm[1]; if(!(lvl in tiers)){ tiers[lvl]=tmm[2]; tn++; } }
    if(tn>=2){
      out.ageTiers=tiers;
      out.notes.push("年龄按学历分档："+["本科","硕士","博士"].filter(function(k){return tiers[k];})
        .map(function(k){return (k==="硕士"?"研究生":k)+" "+tiers[k]+" 周岁以下";}).join("、"));
    }
    var ar=t.match(/(\d{2})\s*(?:周岁)?\s*[至到~～\-—－]\s*(\d{2})\s*周岁/);
    var am=t.match(/(\d{2})\s*周岁\s*(?:及|以)?以下/)||t.match(/不超过\s*(\d{2})\s*周岁/)||t.match(/(\d{2})\s*岁\s*(?:及)?以下/);
    if(tn>=2) set("ageMax", tiers["本科"]||tiers["硕士"]||tiers["博士"]);
    else if(ar) set("ageMax",ar[2]); else if(am) set("ageMax",am[1]);
    if(tn<2 && ar && am && ar[2]!==am[1])
      out.notes.push("公告里出现不同的年龄上限（"+ar[2]+"、"+am[1]+" 周岁），以岗位表里这个岗位的写法为准");

    // 专业：名称连代码一起抄。前一个字符不能是字母数字，避免把岗位编码 BA2026… 读成专业代码
    var codes=[], seen={}, re=/(^|[^A-Za-z0-9一-龥])([一-龥]{0,14})\s*[（(]?\s*([ABC]\d{4}(?:\d{2})?)(?!\d)/g;
    while((m=re.exec(t))){
      var nm=m[2].replace(/^.*(?:专业|须为|要求|限)/,""), cd=m[3];
      if(!seen[cd]){ seen[cd]=1; codes.push((nm?nm+" ":"")+cd); }
    }
    if(codes.length) set("majors", codes.join("、"));
    else if((m=t.match(/专业(?:要求)?\s*[：:]\s*([^。；;\n]{2,40})/))) set("majors", /不限/.test(m[1]) ? "不限" : m[1].trim());
    else if(/专业不限|不限专业/.test(t)) set("majors","不限");

    // 教师资格证
    var ts=sentOf(/教师资格/);
    if(ts){
      var tm=ts.match(/(小学|初中|初级中学|高中|高级中学|中职|中等职业学校)(?:及以上)?[^。；;，,]{0,6}?(体育与健康|体育)/);
      if(tm) set("tzSubject", STAGE[tm[1]]+tm[2]);
      else{
        var ns=(out.name||"").match(/(小学|初中|高中|中职)/);
        if(ns && /体育/.test(out.name||"")){ set("tzSubject", ns[1]+"体育"); out.notes.push("公告只写了「相应学段学科」，已按岗位名称推断为「"+ns[1]+"体育」，核对一下"); }
        else out.notes.push("公告要求教师资格证，但没写学段学科，手动补上");
      }
      // 只在提到教资的句子里找截止日，免得拿到毕业证、学位证的日期
      var tzText=S.filter(function(x){ return /教师资格/.test(x); }).join("；");
      if((m=tzText.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日\s*(?:[（(]含[）)])?\s*(?:之)?前\s*(?:取得|获得|提供)/)))
        out.notes.push("报名时没有教资可先报，须在 "+m[1]+" 年 "+m[2]+" 月 "+m[3]+" 日前取得");
    }

    // 运动员等级：放宽条款、非体育专业附加条件、优先加分都不是本岗门槛
    var LV=/(国际级运动健将|运动健将|国家一级|国家二级|国家三级|一级|二级|三级)[^。；;，,]{0,6}运动员|运动员[^。；;，,]{0,8}(国际级运动健将|运动健将|一级|二级|三级)/;
    for(var i=0;i<S.length;i++){
      var s=S[i], lm=s.match(LV);
      if(!lm || /放宽|非体育专业|优先|加分/.test(s)) continue;
      set("athLevel", (lm[1]||lm[2]).replace("国家",""));
      var sp=s.match(new RegExp(SPORTS,"g"));
      if(sp) set("athDisc", sp.filter(function(x,k){ return sp.indexOf(x)===k; }).join("/"));
      break;
    }

    // 普通话
    if((m=t.match(/普通话[^。；;]{0,10}?(一级甲等|一级乙等|二级甲等|二级乙等|一甲|一乙|二甲|二乙)/))){
      var PM={"一甲":"一级甲等","一乙":"一级乙等","二甲":"二级甲等","二乙":"二级乙等"};
      set("mandarin", PM[m[1]]||m[1]);
    }

    // 其他条款：没有专门选项的限制，原文照录
    var OTHER=/应届|毕业生|经历|经验|年以上|专项|方向证明|性别|男性|女性|限男|限女|放宽|资格复审|岗位培训|身高|视力|职称|公费师范|非体育专业|之前通过|认定或评审/;
    var others=S.filter(function(s){ return OTHER.test(s); });
    if(others.length) set("other", others.join("；"));

    var miss=[];
    if(!out.edu) miss.push("学历");
    if(!out.majors) miss.push("专业");
    if(!out.ageMax) miss.push("年龄上限");
    if(!out.tzSubject && !out.athLevel) miss.push("教资或运动员等级");
    out.missing=miss; out.src=String(raw);
    return out;
  }

  function parseNotice(raw){
    var rows=splitRows(half(raw));
    if(rows && rows.length) return rows.map(function(r){ return parseOne(r.text, r.cells); });
    return [parseOne(raw,{})];
  }
  return {parseNotice:parseNotice};
})();

function renderSide(){
  var g=gates(), o=0,n=0,hd=0;
  // 只有硬门槛进计数。加分项没有不叫“不满足”，
  // 把可有可无的东西算进失败数，会让人以为自己根本报不了名。
  g.forEach(function(x){ if(!x.hard || x.st==="blank") return;
    if(x.st==="pass")o++; else if(x.st==="fail")n++; else hd++; });
  el("tOk").textContent=o; el("tNo").textContent=n; el("tHd").textContent=hd;
  var miss=required();
  el("reqBody").innerHTML = miss.length
    ? '<p class="req-n">还差 '+miss.length+' 项</p><ul class="req-l">'+
      miss.map(function(x){return '<li>'+esc(x.t)+'</li>';}).join("")+'</ul>'
    : '<p class="req-ok">必填项已齐</p>';
  var en=el("expNote");
  if(en){ en.hidden=!miss.length;
    en.textContent = miss.length ? "必填项还差 "+miss.length+" 项，现在导出的档案不完整，补齐后再导出。" : ""; }
  el("gates").innerHTML=g.map(function(x){
    var m=x.st==="pass"?["p","满足"]:x.st==="fail"?["f","不满足"]
             :x.st==="none"?["i","未取得"]:x.st==="blank"?["b","未填写"]:["h","待确认"];
    return '<div class="gate"><span class="mark '+m[0]+'">'+m[1]+'</span>'+
      '<span><span class="gt">'+esc(x.t)+'</span>'+
      '<span class="gn">'+esc(x.eff)+' · '+esc(x.why)+'</span></span></div>';
  }).join("");
}

/* ═══════════ 岗位对照 ═══════════
   前面几组回答"你有什么"，这一组回答"这份公告你能不能报"。
   国内编制岗是布尔硬筛：不符合就是连报名按钮都点不下去，没有分数可言。 */
var EDU_RANK={"专科":1,"本科":2,"硕士":3,"博士":4};
var EDU_REQ={"专科及以上":1,"本科及以上":2,"硕士及以上":3,"博士":4};
var PTH_RANK={"二级乙等":1,"二乙":1,"二级甲等":2,"二甲":2,"一级乙等":3,"一乙":3,"一级甲等":4,"一甲":4};
var ATH_RANK={"三级":1,"二级":2,"一级":3,"运动健将":4,"国际级运动健将":5};

function rankOf(map,txt){
  var best=0; if(!txt) return 0;
  Object.keys(map).forEach(function(k){ if(String(txt).indexOf(k)>=0) best=Math.max(best,map[k]); });
  return best;
}

/* 专业目录的包含规则：四位代码含其下所有六位专业。
   公告写 B0402（体育学类），你的 B040202（运动训练）就在里面。
   这一条直接决定能不能报名，却是最多人搞错的地方。 */
function majorMatch(mine, wanted){
  if(!wanted) return {ok:null,why:"还没填公告的专业范围"};
  if(/^\s*不限\s*$|专业不限/.test(wanted)) return {ok:true,why:"公告专业不限"};
  var code=(mine.code||"").toUpperCase().trim(), name=(mine.major||"").trim();
  var list=wanted.toUpperCase().replace(/[、，,；;]/g,"|").split("|")
    .map(function(x){return x.trim();}).filter(Boolean);
  for(var i=0;i<list.length;i++){
    var w=list[i];
    var m=w.match(/[A-Z]\d{4,6}/);
    if(m && code){
      if(code===m[0]) return {ok:true,why:"专业代码 "+code+" 直接列明"};
      if(code.indexOf(m[0])===0 && m[0].length<code.length)
        return {ok:true,why:m[0]+" 为大类，含你的 "+code};
    }
    if(name && w.indexOf(name.toUpperCase())>=0) return {ok:true,why:"专业名称列明"};
  }
  if(!code) return {ok:null,why:"你没填专业代码，无法比对——去教务处或成绩单上核准"};
  return {ok:false,why:"你的 "+(code||name)+" 不在公告列出的专业范围内"};
}


/* 「其他条款」里有几句反复出现，而档案里其实已经有答案——
   能自动判的就别推给人工，这正是这套工具区别于一张勾选清单的地方。 */
var PRO_TEAMS=["省级以上专业运动队","职业俱乐部运动队","地市级以上体校"];
function scanClause(txt,f,j){
  j=j||{};
  var done={}, left=[];
  /* 逐句判断：认得的句子自动比对，认不得的留给用户逐字核对 */
  String(txt).split(/[。；;\n]+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){
    var hit=false, gm;
    if(/(运动队|体育运动学校|体校|专业[^。；;]{0,4}训练)[^。；;]{0,20}(经历|背景)/.test(s)){
      hit=true;
      // 「岗位有训练经历要求的，须提供证明」是材料说明，不是本岗门槛
      if(!done.pro && !/有[^。；;]{0,10}要求的/.test(s)){ done.pro=1;
        var withOrg=S.exps.filter(function(e){return e.org;});
        var pro=withOrg.filter(function(e){return PRO_TEAMS.indexOf(e.nature)>=0;});
        if(pro.length) f.ok("专业运动队经历："+pro.map(function(e){return e.org;}).join("、"));
        else if(!withOrg.length) f.ask("公告要求专业运动队训练经历，你还没填经历");
        else if(withOrg.some(function(e){return !e.nature;}))
          f.ask("有经历还没选单位性质，选完才能判断是否满足「专业运动队训练经历」");
        else f.no("公告要求专业运动队训练经历，你填的单位都不是专业运动队——商业机构和学校不被认定，这一条补不了");
      }
    }
    // 「招聘对象：2026年毕业生」这类限定某一届的，和你的毕业年份比
    if((gm=s.match(/(\d{4})\s*(?:年|届)\s*(?:应届)?\s*毕业生/)) && !/社会|往届|在职|以前|之前/.test(s)){
      hit=true;
      if(!done.grad){ done.grad=1;
        var y=parseInt(S.edu.gradYear,10), want=parseInt(gm[1],10);
        if(!y) f.ask("招聘对象限 "+want+" 年毕业生，你没填毕业年份");
        else if(y===want) f.ok("招聘对象是 "+want+" 年毕业生，你符合");
        else f.no("招聘对象限 "+want+" 年毕业生，你是 "+y+" 年毕业——这一批报不了，盯下一批");
      }
    } else if(/应届/.test(s)){
      hit=true;
      if(!done.fresh){ done.fresh=1;
        var y2=parseInt(S.edu.gradYear,10), now=new Date().getFullYear();
        if(!y2) f.ask("公告限应届，你没填毕业年份");
        else if(y2>=now) f.ok("毕业年份 "+y2+"，应届身份成立");
        else f.no("毕业年份 "+y2+" 已过，应届身份不成立——择业期政策各地不同，须查公告原文");
      }
    }
    /* 下面三类已有专门选项：抄到了但上面没选，就提醒去选 */
    if(/户籍|生源/.test(s)){ hit=true;
      if(!done.hk){ done.hk=1; if(j.hukouReq!=="有限制") f.ask("公告提到户籍或生源——在上面「户籍 / 生源要求」选「有限制」，再选你是否符合"); } }
    if(/党员|中共/.test(s)){ hit=true;
      if(!done.party){ done.party=1; if(j.partyReq!=="中共党员") f.ask("公告提到政治面貌——在上面「政治面貌要求」里选上"); } }
    if(/学位/.test(s)){ hit=true;
      if(!done.deg){ done.deg=1; if(j.degreeReq!=="要求学位") f.ask("公告提到学位——在上面「学位要求」里选上"); } }
    if(/放宽至本科/.test(s)) hit=true;   // 学历比对里已处理
    if(!hit) left.push(s);
  });
  if(left.length) f.ask("公告另有条款，逐字核对："+left.join("；"));
}

function matchJob(j){
  var R=[], hard=[], fix=[], E=S.edu;
  // 有证书还没选类别时，不能断定「你没有某类证书」
  var uncat=S.creds.some(function(c){return c.name&&!c.cat;});
  function ok(t){ R.push({s:"ok",t:t}); }
  function no(t){ R.push({s:"no",t:t}); hard.push(t); }
  function mend(t){ R.push({s:"fix",t:t}); fix.push(t); }
  function ask(t){ R.push({s:"ask",t:t}); }

  // 学历
  if(j.edu){
    var need=EDU_REQ[j.edu]||0, got=EDU_RANK[E.level]||0;
    if(!got) ask("你还没选学历层次");
    else if(got>=need) ok("学历 "+E.level+" 满足「"+j.edu+"」");
    else if(/放宽至本科/.test(j.other||"") && got>=EDU_RANK["本科"]){
      // 如广州白云区：研究生岗，「具有一级运动员及以上等级证书的可放宽至本科学历学位」
      var lv1=S.creds.some(function(c){ return c.cat==="运动员等级"&&c.status==="已取得"&&rankOf(ATH_RANK,c.level||c.name)>=ATH_RANK["一级"]; });
      if(lv1) ok("学历：公告允许一级运动员放宽至本科，你有一级运动员证");
      else no("学历达不到「"+j.edu+"」；放宽到本科要一级运动员及以上，你没有——这一条补不了");
    }
    else no("学历 "+E.level+" 达不到「"+j.edu+"」——这一条补不了");
  }
  // 学位
  if(j.degreeReq==="要求学位"){
    if(E.degree==="已取得") ok("学位已取得");
    else if(E.degree==="预计取得（应届）") mend("学位要毕业时才取得——看清公告是否允许报名时未取得、限期提交");
    else if(E.degree==="无学位") no("公告要求学历学位双证，你没有学位——这一条补不了");
    else ask("你还没填学位情况");
  }
  // 师范类
  if(j.normalReq==="要求"){
    if(E.normal==="是") ok("本科为师范类专业，符合");
    else if(E.normal==="否") no("公告要求本科为师范类专业，你的专业不是——这一条补不了");
    else ask("公告要求本科为师范类专业，你还没确认自己算不算——以教务处认定为准");
  }
  // 专业
  var mm=majorMatch(E,j.majors);
  if(mm.ok===true) ok("专业："+mm.why);
  else if(mm.ok===false) no("专业不符："+mm.why);
  else ask(mm.why);
  // 政治面貌
  if(j.partyReq==="中共党员"){
    if(E.party==="中共党员") ok("政治面貌符合：中共党员");
    else if(E.party==="中共预备党员") ask("公告限中共党员，预备党员算不算以公告原文为准");
    else if(E.party) no("公告限中共党员，你是"+E.party+"——这一条补不了");
    else ask("你还没填政治面貌");
  }
  // 户籍 / 生源：只比对「是否符合」，不碰具体户籍
  if(j.hukouReq==="有限制"){
    if(j.hukouOk==="符合") ok("户籍 / 生源符合该岗位要求");
    else if(j.hukouOk==="不符合") no("户籍 / 生源不符合该岗位要求——这一条补不了");
    else if(j.hukouOk==="不确定") ask("去核对公告的户籍 / 生源条款：通常看户口所在地，或高考时的生源地");
    else ask("选一下你是否符合该岗位的户籍 / 生源要求");
  }
  // 教师资格证：学科、学段都要对口
  if(j.tzSubject){
    var tz=S.creds.filter(function(c){return c.cat==="教师资格"&&c.name;})[0];
    if(!tz){ if(uncat) ask("有证书还没选类别，选完才能判断有没有对口的教师资格证");
             else no("公告要求教师资格证（"+j.tzSubject+"），你没有"); }
    else{
      var mine=(tz.disc||"")+(tz.level||"")+tz.name, js=stageOf(j.tzSubject), cs=stageOf(mine);
      var subjOk = j.tzSubject.indexOf("体育")<0 || mine.indexOf("体育")>=0;
      if(!subjOk) no("教师资格证学科和「"+j.tzSubject+"」不对口——学科不对口等于没有");
      else if(js&&cs&&cs<js) no("教师资格证是"+STAGE_NAME[cs]+"学段，岗位要"+STAGE_NAME[js]+"——学段低于要求，这一条补不了");
      else if(!tz.status) ask("教师资格证还没选状态");
      else if(tz.status!=="已取得")
        mend("教师资格证"+(tz.note?"："+tz.note:"尚未取得")+"——多数岗位允许报名时未取得、限期补交，看清公告写的截止日期");
      else if(js&&cs&&cs>js) ask("你是"+STAGE_NAME[cs]+"教资报"+STAGE_NAME[js]+"岗，多数地区认可，以公告原文为准");
      else if(js&&!cs) ask("证书上没写学段，核对是否与「"+j.tzSubject+"」对口");
      else ok("教师资格证 "+(tz.disc||tz.level)+" 对口");
    }
  }
  // 运动员等级
  if(j.athLevel){
    var athCreds=S.creds.filter(function(c){return c.cat==="运动员等级"&&c.name;});
    var mineA=0; athCreds.forEach(function(c){ mineA=Math.max(mineA,rankOf(ATH_RANK,c.level||c.name)); });
    var needA=rankOf(ATH_RANK,j.athLevel);
    if(!athCreds.length){ if(uncat) ask("有证书还没选类别，选完才能判断运动员等级");
                          else no("公告要求运动员等级「"+j.athLevel+"」，你没填等级证书"); }
    else if(mineA>=needA) ok("运动员等级满足「"+j.athLevel+"」");
    else no("运动员等级不足「"+j.athLevel+"」——等级证不能临时补，这一条基本封死");
    // 岗位可能列几个项目任选其一，如罗湖「篮球/排球/网球」
    var want=String(j.athDisc||"").split(/[\/、，,或和及]/).map(function(x){return x.trim();}).filter(Boolean);
    if(athCreds.length && want.length){
      if(athCreds.some(function(c){ return !c.disc; })) ask("你的运动员证书没填项目，核对是否对口「"+want.join("、")+"」");
      else if(!athCreds.some(function(c){ return want.some(function(x){ return c.disc.indexOf(x)>=0; }); }))
        no("运动员等级证项目不对口：岗位要「"+want.join("、")+"」，你的是「"+athCreds.map(function(c){return c.disc;}).join("、")+"」——项目不对口等于没有");
    }
  }
  // 普通话
  if(j.mandarin){
    var pc=S.creds.filter(function(c){return c.cat==="语言文字"&&c.name;})[0];
    var mineP=pc?rankOf(PTH_RANK,pc.level||pc.name):0, needP=rankOf(PTH_RANK,j.mandarin);
    if(!pc){ if(uncat) ask("有证书还没选类别，选完才能判断普通话等级");
             else mend("公告要求普通话「"+j.mandarin+"」，你没填——这个考试频次高，来得及补"); }
    else if(mineP>=needP) ok("普通话 "+pc.level+" 满足「"+j.mandarin+"」");
    else mend("普通话 "+pc.level+" 低于「"+j.mandarin+"」——可以重考，看报名截止前来不来得及");
  }
  // 年龄
  if(j.ageMax&&S.edu.birthYear){
    var age=new Date().getFullYear()-parseInt(S.edu.birthYear,10);
    if(age<=parseInt(j.ageMax,10)) ok("年龄 "+age+" 岁在「"+j.ageMax+"岁以下」之内");
    else no("年龄 "+age+" 岁超过「"+j.ageMax+"岁」——硬性条件，无解");
  } else if(j.ageMax) ask("公告限年龄 "+j.ageMax+" 岁以下，你没填出生年份");

  if(j.other) scanClause(j.other,{no:no,mend:mend,ask:ask,ok:ok},j);

  var verdict = hard.length ? "no" : (fix.length ? "fix" : (R.some(function(x){return x.s==="ask";}) ? "ask" : "ok"));
  return {verdict:verdict, rows:R, hard:hard.length, fix:fix.length};
}

var VERDICT={ok:["p","★ 完全符合","按目前填写的信息，硬门槛都过得了"],
  fix:["h","○ 缺一项可补","有能补齐的项，盯住公告的补交截止日"],
  ask:["i","? 待核对","有条款无法自动判断，需要你对着公告原文看"],
  no:["f","× 不可报","有补不了的硬门槛，果断放弃，不要浪费窗口期"]};

/* ═══════════ 简历 ═══════════
   措辞规则与命令行版 render.py 同源。展示页、简历、自查结论
   必须说同一套话——否则三份材料摆在一起就是自相矛盾。 */
function resumeSections(){
  var out=[];

  // 资质：部分完成输出进度，绝不写成"已通过"；没选状态的不上简历
  var cred=S.creds.filter(function(c){return c.name&&c.status;}).map(function(c){
    if(c.status==="已取得")
      return {k:c.name,v:[c.level,c.issuer].filter(Boolean).join("　"),t:""};
    if(c.status==="部分完成")
      return {k:c.name,v:c.note||"部分完成",t:"进行中"};
    return {k:c.name,v:c.status==="备考中"?"备考中":"计划中",t:"进行中"};
  });
  if(cred.length) out.push({h:"资质证书",rows:cred});

  // 成绩：不可用于等级认定的，不与赛事绑定输出
  var ach=S.achs.filter(function(a){return a.title;}).map(function(a){
    var w=parseFloat(String(a.wind).replace("+",""));
    var mark=(!isNaN(w)&&w>2.0)?"":a.mark;          // 超风速 → 只留名次
    var rank=a.nature==="展演展示"?"参演":a.rank;    // 展演不产生名次
    return {k:a.title,v:[a.lv,a.date].filter(Boolean).join("　"),
            t:[rank,mark].filter(Boolean).join("　")};
  });
  if(ach.length) out.push({h:"赛事与奖项",rows:ach});

  var exp=S.exps.filter(function(e){return e.org&&String(e.role).indexOf("运动员")<0;}).map(function(e){
    return {k:e.org+(e.role?"　"+e.role:""),v:[e.nature,e.span].filter(Boolean).join("　"),
            t:"",body:e.duty};
  });
  if(exp.length) out.push({h:"执教与实践",rows:exp});

  // 学术：照实写状态，报告形式跟在后面，永远不写"发表"
  var pap=S.papers.filter(function(r){return r.title&&r.status;}).map(function(r){
    var form=(r.form==="口头报告"||r.form==="墙报")?"（"+r.form+"）":"";
    return {k:r.title,v:[r.venue,r.author,r.date].filter(Boolean).join("　"),t:r.status+form};
  });
  if(pap.length) out.push({h:"学术成果",rows:pap});

  var work=S.works.filter(function(w){return w.title;}).map(function(w){
    return {k:w.title,v:w.kind,t:"",body:w.proves};
  });
  if(work.length) out.push({h:"作品与展示",rows:work});

  // 技能：自述掌握的降级措辞，不作专业水平主张；没选证明程度的不上简历
  var sk=S.skills.filter(function(k){return k.d&&k.ev;});
  if(sk.length){
    var order={"赛事名次":0,"等级证书":1,"课程修习":2,"自述掌握":3};
    // 注意不能写 order[a.ev]||9 —— "赛事名次"的序号是 0，而 0||9 等于 9，
    // 结果是把最弱的"只是会"排到最前面，正好放在简历最显眼的位置。
    var rank=function(x){ return order[x.ev]==null ? 9 : order[x.ev]; };
    sk=sk.slice().sort(function(a,b){return rank(a)-rank(b);});
    out.push({h:"一专多能",inline:sk.map(function(k){
      return {d:k.d, s:k.ev==="自述掌握" ? "可承担普及性教学" : (k.detail||k.ev)};
    })});
  }
  return out;
}

    (e.logo?'<img class="lg" src="'+e.logo+'" alt="">':"")+'</div>'+
    (eduLine?'<div class="ed"><span style="color:#33414A"><b>'+esc(e.school)+'</b>　'+
      esc([e.major,e.level].filter(Boolean).join("　"))+'</span><span>'+esc(eduMeta)+'</span></div>':"")+
    secs.map(function(sec){
      return '<section><h2>'+esc(sec.h)+'</h2>'+rows(sec)+'</section>'; }).join("")+
    '</div></body></html>';
}

/* 闸门：与 render.py 同一条规则——存在未解决的致命问题就拒绝生成。
   这道闸存在的意义就是拦住「我知道有问题但先发出去再说」。 */
var forceResume=false;
function resumeGate(){
  var box=el("blocked"), btn=el("dlResume");
  // 先看必填：状态、级别这些没选，简历要么缺项、要么写错
  var gaps=required().filter(function(x){return x.r;});
  if(gaps.length){
    box.hidden=false; btn.disabled=true;
    box.innerHTML='<b>先补齐这几项再生成。</b>它们直接决定简历怎么写：<br>'+
      gaps.slice(0,5).map(function(x){ return '· '+esc(x.t); }).join("<br>")+
      (gaps.length>5 ? '<br>· 另有 '+(gaps.length-5)+' 项，见上方「必填项」' : '');
    return false;
  }
  var bad=audit().filter(function(x){return x.s===3;});
  if(!bad.length||forceResume){ box.hidden=true; btn.disabled=false; return true; }
  box.hidden=false; btn.disabled=true;
  box.innerHTML='<b>已拦住，未生成。</b>还有 '+bad.length+' 条「要紧」问题没处理，'+
    '这时候出的简历会把问题一起带到对方手里：<br>'+
    bad.slice(0,3).map(function(x){
      return '· '+esc(x.t.replace(/<[^>]+>/g,"").slice(0,44))+'…'; }).join("<br>")+
    '<br><button type="button" id="forceBtn">我知道有问题，仍要生成</button>';
  return false;
}


/* 安卓与微信内置浏览器普遍不支持 <a download>：点下去 blob 地址被交给外部
   应用，而 blob 只在生成它的那个网页里有效，外部拿到就是一个打不开的链接。
   实测安卓上会跳出「不支持转换的链接」。
   而且下载 HTML 本来就是多余的一步——要的是 PDF，那就直接显示出来打印。 */
var H2C_CDN="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

function showDoc(html, title, kind){
  var ov=document.createElement("div");
  ov.className="ovl";
  var btns, tip;
  if(!IS_MOBILE){
    btns='<button type="button" class="ovl-b main" data-act="print">打印 / 存 PDF</button>'+
         '<button type="button" class="ovl-b" data-act="dl">下载文件</button>';
    tip='在打印对话框里把打印机选成「另存为 PDF」。';
  } else {
    var pdfOK = kind==="resume" && !IN_APP && !IN_ARTIFACT;
    btns='<button type="button" class="ovl-b main" data-act="img">存为图片</button>'+
         (pdfOK ? '<button type="button" class="ovl-b" data-act="pdf">存 PDF</button>' : "");
    tip = IN_APP
      ? '点「存为图片」，生成后<b>长按图片保存</b>。要 PDF：点右上角 ··· →「在浏览器打开」，再回到这里。'
      : '点「存为图片」后<b>长按图片保存</b>，最稳。'+(pdfOK ? '「存 PDF」会打开一个只有简历的打印页。' : '');
  }
  btns+='<button type="button" class="ovl-b" data-act="close">关闭</button>';

  ov.innerHTML=
    '<div class="ovl-bar"><span class="ovl-t">'+esc(title)+'</span>'+btns+'</div>'+
    '<p class="ovl-tip">'+tip+'</p>'+
    '<div class="ovl-body"><div class="ovl-box">'+
      '<iframe class="ovl-fr" title="'+esc(title)+'"></iframe></div>'+
      '<div class="ovl-img"></div></div>';
  document.body.appendChild(ov);
  document.body.style.overflow="hidden";

  var fr=ov.querySelector(".ovl-fr"), box=ov.querySelector(".ovl-box"),
      body=ov.querySelector(".ovl-body");

  /* iframe 不理会内部文档的 viewport meta——它的布局视口就是元素自身宽度。
     所以按 A4 的 794px 布局，再用 CSS 整体缩放到屏幕宽度。
     transform 不改变占位尺寸，外框的高度要按缩放后的值单独给。 */
  function fit(){
    var doc=fr.contentDocument; if(!doc) return;
    var h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
    var avail=body.clientWidth, k=Math.min(1, avail/794);
    fr.style.width="794px"; fr.style.height=h+"px";
    fr.style.transform="scale("+k+")"; fr.style.transformOrigin="top left";
    box.style.width=(794*k)+"px"; box.style.height=(h*k)+"px";
  }
  fr.addEventListener("load",function(){ fit(); setTimeout(fit,250); });
  window.addEventListener("resize",fit);
  fr.srcdoc=html;

  ov.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act");
    if(act==="close"){ window.removeEventListener("resize",fit); ov.remove(); document.body.style.overflow=""; return; }
    if(act==="print"){
      try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
      catch(err){ window.print(); }
      return;
    }
    if(act==="dl"){ doExport(b, kind==="resume" ? (S.me.name||"简历")+"_简历.html" : "自查结果.html", html); return; }
    if(act==="pdf"){ location.href=location.pathname+"?print=resume"; return; }
    if(act==="img"){ makeImage(ov,fr,kind,b); }
  });
}

/* 把预览里的版面画成一张图。库注入到预览 iframe 自己的窗口里再调用——
   从父窗口去画另一个窗口里的元素，会碰到跨窗口的类型判断问题。 */
function makeImage(ov,fr,kind,btn){
  var tipEl=ov.querySelector(".ovl-tip"), old=btn.textContent;
  if(ov.querySelector(".ovl-img img")){          // 已生成：在图片与预览之间切换
    var on=ov.classList.toggle("showimg");
    btn.textContent = on ? "看预览" : "看图片";
    return;
  }
  var win=fr.contentWindow, doc=fr.contentDocument;
  function fail(msg){ btn.disabled=false; btn.textContent=old; tipEl.innerHTML='<b class="ovl-bad">'+msg+'</b>'; }
  if(!win||!doc||!doc.body){ fail("预览还没加载完，稍等再点。"); return; }
  btn.disabled=true; btn.textContent="生成中…";

  function render(){
    var target=doc.querySelector(kind==="resume" ? ".pg" : ".w") || doc.body;
    win.html2canvas(target,{scale:2, backgroundColor:"#ffffff", logging:false, useCORS:true})
      .then(function(cv){
        var img=new Image();
        img.alt = kind==="resume" ? "简历图片，长按保存" : "自查结果图片，长按保存";
        img.src = cv.toDataURL("image/png");
        ov.querySelector(".ovl-img").appendChild(img);
        ov.classList.add("showimg");
        btn.disabled=false; btn.textContent="看预览";
        tipEl.innerHTML='<b>长按图片</b> → 保存到手机，或直接发给别人。';
      })
      .catch(function(){ fail("图片生成失败。关掉重新打开再试一次。"); });
  }
  if(win.html2canvas){ render(); return; }
  var sc=doc.createElement("script");
  /* 库和页面放在同一目录自己托管：国内访问 cdnjs 时好时坏，而页面本身所在的域名一定是通的 */
  sc.src = IN_ARTIFACT ? H2C_CDN : new URL("html2canvas.min.js", location.href.split("?")[0]).href;
  sc.onload=render;
  sc.onerror=function(){ fail("图片组件没加载出来，检查网络后再点一次。"); };
  doc.head.appendChild(sc);
}

/* 手机系统浏览器里要 PDF：不从 iframe 打印，而是整页换成只有简历的独立页，
   在顶层窗口调 print()——这是 Safari 和安卓 Chrome 都认的路。 */
function openPrintPage(){
  var d=new DOMParser().parseFromString(buildResumeDoc(),"text/html");
  [].slice.call(document.querySelectorAll('style,link[rel="stylesheet"]'))
    .forEach(function(n){ n.parentNode.removeChild(n); });
  [].slice.call(d.querySelectorAll("style")).forEach(function(st){
    var n=document.createElement("style"); n.textContent=st.textContent; document.head.appendChild(n);
  });
  var ex=document.createElement("style");
  ex.textContent=
    '.pp-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;'+
      'padding:12px 14px;background:#fff;border-bottom:1px solid #C6D0D5;'+
      'font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}'+
    '.pp-bar button{appearance:none;font:600 15px/1 inherit;padding:12px 18px;border-radius:5px;'+
      'border:1px solid #1B4D6B;background:#fff;color:#1B4D6B;cursor:pointer}'+
    '.pp-bar button.main{background:#1B4D6B;color:#fff}'+
    '.pp-tip{flex-basis:100%;margin:2px 0 0;font-size:13px;line-height:1.7;color:#5B6B73}'+
    '.pp-tip b{color:#111A1F}'+
    '@media print{.pp-bar{display:none!important}.pg{zoom:1!important}}';
  document.head.appendChild(ex);
  document.title=d.title;
  document.body.innerHTML=
    '<div class="pp-bar">'+
      '<button type="button" class="main" id="ppPrint">存 PDF</button>'+
      '<button type="button" id="ppBack">返回填表</button>'+
      '<p class="pp-tip"><b>安卓</b>：打印界面顶部把打印机选成「另存为 PDF」。<br>'+
      '<b>iPhone</b>：在打印预览上两指张开，变成 PDF 后点右上角分享保存。<br>'+
      '点了没反应，说明还在微信等 app 里，要先用系统浏览器打开。</p>'+
    '</div>'+d.body.innerHTML;
  var pg=document.querySelector(".pg");
  /* 不能用 innerWidth：手机浏览器发现内容比屏幕宽会自动缩小整页，innerWidth 随之变大
     （实测 375 宽的视口里读到 784），算出的缩放≈1，版面照样溢出，还自我强化。
     documentElement.clientWidth 是布局视口宽度，不受这种自动缩放影响。 */
  function zoomFit(){
    if(!pg) return;
    var w=document.documentElement.clientWidth||window.innerWidth;
    pg.style.zoom=Math.min(1,(w-8)/794);
  }
  zoomFit(); window.addEventListener("resize",zoomFit);
  document.getElementById("ppPrint").onclick=function(){ window.print(); };
  document.getElementById("ppBack").onclick=function(){ location.href=location.pathname; };
}

/* 导出有三条路，取决于这份页面跑在哪里：
   Artifact 沙箱里 blob 下载是静默失效的，必须走 downloads 能力；
   自己托管时没有 window.claude，普通 blob 下载反而是最顺的；
   两条都走不通才退回文本框手动复制。 */
var IN_ARTIFACT = !!(window.claude && window.claude.use);
var DL=null;
if(IN_ARTIFACT){
  window.claude.use("downloads").then(function(d){ DL=d; }).catch(function(){});
}

/* 手机上这三件事都靠不住，只能按环境分流：
   - <a download>：属性存在不代表能下载，安卓会把 blob 地址甩给外部应用
   - print()：微信等内置浏览器里是空操作；系统浏览器里从 iframe 发起也不可靠
   - 兜底文本框：在侧栏里，一开预览层就被整个盖住，点了等于没反应
   所以手机上主推「存为图片 → 长按保存」，这是内置浏览器里唯一稳定的出文件方式。 */
var UA=navigator.userAgent||"";
var IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(UA)
  || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);      // iPadOS 伪装成 Mac
var IN_APP=/MicroMessenger|QQ\/|Weibo|DingTalk|Lark|Feishu|AlipayClient|baiduboxapp|Quark|UCBrowser|aweme|NewsArticle/i.test(UA);
var CAN_DL=("download" in document.createElement("a")) && !IS_MOBILE;

function blobSave(filename,data){
  if(!CAN_DL) return false;
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));
    a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    return true;
  }catch(e){ return false; }
}

function doExport(btn,filename,data){
  var old=btn.textContent;
  function done(msg){ btn.textContent=msg;
    setTimeout(function(){ btn.textContent=old; btn.disabled=false; },2000); }
  if(!DL){
    if(!IN_ARTIFACT && blobSave(filename,data)){ done("已下载"); return; }
    var t=el("fallback"); t.hidden=false; t.value=data; t.focus(); t.select();
    done(CAN_DL ? "已展开，手动复制" : "手机不支持下载，长按复制"); return;
  }
  btn.disabled=true; btn.textContent="等待确认…";
  DL.save({filename:filename,data:data}).then(function(){ done("已保存"); })
    .catch(function(err){
      var c=err&&err.code;
      done(c==="declined"?"已取消":c==="rate_limited"?"稍后再试":"保存失败，改用手动复制");
      if(c!=="declined"&&c!=="rate_limited"){
        var t=el("fallback"); t.hidden=false; t.value=data; t.select();
      }
    });
}

var PRINT_MODE = !IN_ARTIFACT && /[?&]print=resume(&|$)/.test(location.search);
if(PRINT_MODE) openPrintPage(); else renderAll();
</script>

</body>

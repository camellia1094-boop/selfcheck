    '</style></head><body><div class="pg">'+head+
    sec("核心荣誉与竞赛成绩", honors)+
    sec("一专多能 · 可任教项目", skillBody)+
    sec("执教与教学经历", expBody)+
    sec("教育科研", R.papers.map(item).join(""))+
    sec("项目实践", R.projects.map(item).join(""))+
    sec("教育背景", eduBody)+
    ((certBody||qrBox) ? '<section><h2>证书与技能</h2><div class="fx"><div class="grow">'+certBody+'</div>'+qrBox+'</div></section>' : "")+
    '</div></body></html>';
}

/* 闸门：与 render.py 同一条规则——存在未解决的致命问题就拒绝生成。
   这道闸存在的意义就是拦住「我知道有问题但先发出去再说」。 */
var forceResume=false;
function resumeGate(){
  var box=el("blocked"), btn=el("dlResume");
  // 先看必填：状态、级别这些没选，简历要么缺项、要么写错
  var gaps=required().filter(function(x){return x.r;});
  if(gaps.length){
    box.hidden=false; btn.disabled=true;
    box.innerHTML='<b>先补齐这几项再生成。</b>它们直接决定简历怎么写：<br>'+
      gaps.slice(0,5).map(function(x){ return '· '+esc(x.t); }).join("<br>")+
      (gaps.length>5 ? '<br>· 另有 '+(gaps.length-5)+' 项，见上方「必填项」' : '');
    return false;
  }
  var bad=audit().filter(function(x){return x.s===3;});
  if(!bad.length||forceResume){ box.hidden=true; btn.disabled=false; return true; }
  box.hidden=false; btn.disabled=true;
  box.innerHTML='<b>已拦住，未生成。</b>还有 '+bad.length+' 条「要紧」问题没处理，'+
    '这时候出的简历会把问题一起带到对方手里：<br>'+
    bad.slice(0,3).map(function(x){
      return '· '+esc(x.t.replace(/<[^>]+>/g,"").slice(0,44))+'…'; }).join("<br>")+
    '<br><button type="button" id="forceBtn">我知道有问题，仍要生成</button>';
  return false;
}


/* 安卓与微信内置浏览器普遍不支持 <a download>：点下去 blob 地址被交给外部
   应用，而 blob 只在生成它的那个网页里有效，外部拿到就是一个打不开的链接。
   实测安卓上会跳出「不支持转换的链接」。
   而且下载 HTML 本来就是多余的一步——要的是 PDF，那就直接显示出来打印。 */
var H2C_CDN="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

function showDoc(html, title, kind){
  var ov=document.createElement("div");
  ov.className="ovl";
  var btns, tip;
  if(!IS_MOBILE){
    btns='<button type="button" class="ovl-b main" data-act="print">打印 / 存 PDF</button>'+
         '<button type="button" class="ovl-b" data-act="dl">下载文件</button>';
    tip='在打印对话框里把打印机选成「另存为 PDF」。';
  } else {
    var pdfOK = kind==="resume" && !IN_APP && !IN_ARTIFACT;
    btns='<button type="button" class="ovl-b main" data-act="img">存为图片</button>'+
         (pdfOK ? '<button type="button" class="ovl-b" data-act="pdf">存 PDF</button>' : "");
    tip = IN_APP
      ? '点「存为图片」，生成后<b>长按图片保存</b>。要 PDF：点右上角 ··· →「在浏览器打开」，再回到这里。'
      : '点「存为图片」后<b>长按图片保存</b>，最稳。'+(pdfOK ? '「存 PDF」会打开一个只有简历的打印页。' : '');
  }
  btns+='<button type="button" class="ovl-b" data-act="close">关闭</button>';

  ov.innerHTML=
    '<div class="ovl-bar"><span class="ovl-t">'+esc(title)+'</span>'+btns+'</div>'+
    '<p class="ovl-tip"><span class="ovl-tipt">'+tip+'</span>'+
      '<button type="button" class="ovl-fb" data-act="fb">有问题？反馈</button></p>'+
    '<div class="ovl-body"><div class="ovl-box">'+
      '<iframe class="ovl-fr" title="'+esc(title)+'"></iframe></div>'+
      '<div class="ovl-img"></div></div>';
  document.body.appendChild(ov);
  document.body.style.overflow="hidden";

  var fr=ov.querySelector(".ovl-fr"), box=ov.querySelector(".ovl-box"),
      body=ov.querySelector(".ovl-body");

  /* iframe 不理会内部文档的 viewport meta——它的布局视口就是元素自身宽度。
     所以按 A4 的 794px 布局，再用 CSS 整体缩放到屏幕宽度。
     transform 不改变占位尺寸，外框的高度要按缩放后的值单独给。 */
  function fit(){
    var doc=fr.contentDocument; if(!doc) return;
    var h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
    var avail=body.clientWidth, k=Math.min(1, avail/794);
    fr.style.width="794px"; fr.style.height=h+"px";
    fr.style.transform="scale("+k+")"; fr.style.transformOrigin="top left";
    box.style.width=(794*k)+"px"; box.style.height=(h*k)+"px";
  }
  fr.addEventListener("load",function(){ fit(); setTimeout(fit,250); });
  window.addEventListener("resize",fit);
  fr.srcdoc=html;

  ov.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act");
    if(act==="close"){ window.removeEventListener("resize",fit); ov.remove(); document.body.style.overflow=""; return; }
    if(act==="print"){
      try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
      catch(err){ window.print(); }
      return;
    }
    if(act==="dl"){ doExport(b, kind==="resume" ? (S.me.name||"简历")+"_简历.html" : "自查结果.html", html); return; }
    if(act==="pdf"){ location.href=location.pathname+"?print=resume"; return; }
    if(act==="fb"){
      openFeedback("export","export",{doc:kind==="resume"?"简历":"自查结果",
        tip:ov.querySelector(".ovl-tipt").textContent, img:!!ov.querySelector(".ovl-img img")});
      return;
    }
    if(act==="img"){ makeImage(ov,fr,kind,b); }
  });
}

/* 把预览里的版面画成一张图。库注入到预览 iframe 自己的窗口里再调用——
   从父窗口去画另一个窗口里的元素，会碰到跨窗口的类型判断问题。 */
function makeImage(ov,fr,kind,btn){
  var tipEl=ov.querySelector(".ovl-tipt"), old=btn.textContent;
  if(ov.querySelector(".ovl-img img")){          // 已生成：在图片与预览之间切换
    var on=ov.classList.toggle("showimg");
    btn.textContent = on ? "看预览" : "看图片";
    return;
  }
  var win=fr.contentWindow, doc=fr.contentDocument;
  function fail(msg){ btn.disabled=false; btn.textContent=old; tipEl.innerHTML='<b class="ovl-bad">'+msg+'</b>'; }
  if(!win||!doc||!doc.body){ fail("预览还没加载完，稍等再点。"); return; }
  btn.disabled=true; btn.textContent="生成中…";

  function render(){
    var target=doc.querySelector(kind==="resume" ? ".pg" : ".w") || doc.body;
    win.html2canvas(target,{scale:2, backgroundColor:"#ffffff", logging:false, useCORS:true})
      .then(function(cv){
        var img=new Image();
        img.alt = kind==="resume" ? "简历图片，长按保存" : "自查结果图片，长按保存";
        img.src = cv.toDataURL("image/png");
        ov.querySelector(".ovl-img").appendChild(img);
        ov.classList.add("showimg");
        btn.disabled=false; btn.textContent="看预览";
        tipEl.innerHTML='<b>长按图片</b> → 保存到手机，或直接发给别人。';
      })
      .catch(function(){ fail("图片生成失败。关掉重新打开再试一次。"); });
  }
  if(win.html2canvas){ render(); return; }
  var sc=doc.createElement("script");
  /* 库和页面放在同一目录自己托管：国内访问 cdnjs 时好时坏，而页面本身所在的域名一定是通的 */
  sc.src = IN_ARTIFACT ? H2C_CDN : new URL("html2canvas.min.js", location.href.split("?")[0]).href;
  sc.onload=render;
  sc.onerror=function(){ fail("图片组件没加载出来，检查网络后再点一次。"); };
  doc.head.appendChild(sc);
}

/* 手机系统浏览器里要 PDF：不从 iframe 打印，而是整页换成只有简历的独立页，
   在顶层窗口调 print()——这是 Safari 和安卓 Chrome 都认的路。 */
function openPrintPage(){
  var d=new DOMParser().parseFromString(buildResumeDoc(),"text/html");
  [].slice.call(document.querySelectorAll('style,link[rel="stylesheet"]'))
    .forEach(function(n){ n.parentNode.removeChild(n); });
  [].slice.call(d.querySelectorAll("style")).forEach(function(st){
    var n=document.createElement("style"); n.textContent=st.textContent; document.head.appendChild(n);
  });
  var ex=document.createElement("style");
  ex.textContent=
    '.pp-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;'+
      'padding:12px 14px;background:#fff;border-bottom:1px solid #C6D0D5;'+
      'font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}'+
    '.pp-bar button{appearance:none;font:600 15px/1 inherit;padding:12px 18px;border-radius:5px;'+
      'border:1px solid #1B4D6B;background:#fff;color:#1B4D6B;cursor:pointer}'+
    '.pp-bar button.main{background:#1B4D6B;color:#fff}'+
    '.pp-tip{flex-basis:100%;margin:2px 0 0;font-size:13px;line-height:1.7;color:#5B6B73}'+
    '.pp-tip b{color:#111A1F}'+
    '@media print{.pp-bar{display:none!important}.pg{zoom:1!important}}';
  document.head.appendChild(ex);
  document.title=d.title;
  document.body.innerHTML=
    '<div class="pp-bar">'+
      '<button type="button" class="main" id="ppPrint">存 PDF</button>'+
      '<button type="button" id="ppBack">返回填表</button>'+
      '<p class="pp-tip"><b>安卓</b>：打印界面顶部把打印机选成「另存为 PDF」。<br>'+
      '<b>iPhone</b>：在打印预览上两指张开，变成 PDF 后点右上角分享保存。<br>'+
      '点了没反应，说明还在微信等 app 里，要先用系统浏览器打开。</p>'+
    '</div>'+d.body.innerHTML;
  var pg=document.querySelector(".pg");
  /* 不能用 innerWidth：手机浏览器发现内容比屏幕宽会自动缩小整页，innerWidth 随之变大
     （实测 375 宽的视口里读到 784），算出的缩放≈1，版面照样溢出，还自我强化。
     documentElement.clientWidth 是布局视口宽度，不受这种自动缩放影响。 */
  function zoomFit(){
    if(!pg) return;
    var w=document.documentElement.clientWidth||window.innerWidth;
    pg.style.zoom=Math.min(1,(w-8)/794);
  }
  zoomFit(); window.addEventListener("resize",zoomFit);
  document.getElementById("ppPrint").onclick=function(){ window.print(); };
  document.getElementById("ppBack").onclick=function(){ location.href=location.pathname; };
}

/* 导出有三条路，取决于这份页面跑在哪里：
   Artifact 沙箱里 blob 下载是静默失效的，必须走 downloads 能力；
   自己托管时没有 window.claude，普通 blob 下载反而是最顺的；
   两条都走不通才退回文本框手动复制。 */
var IN_ARTIFACT = !!(window.claude && window.claude.use);

/* 展示页二维码：qrcode-generator 1.4.4，和页面同目录自托管（国内访问 cdnjs 不稳定）。
   纠错级别用 M：H 级在 20mm 打印尺寸下模块太密，纸上扫不出来——这个坑踩过 */
var QR_CDN="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js", QR_CBS=[], QR_STATE="idle";
function loadQR(cb){
  if(window.qrcode){ if(cb) cb(); return; }
  if(cb) QR_CBS.push(cb);
  if(QR_STATE!=="idle") return;
  QR_STATE="loading";
  var sc=document.createElement("script");
  sc.src = IN_ARTIFACT ? QR_CDN : new URL("qrcode.min.js", location.href.split("?")[0]).href;
  sc.onload=sc.onerror=function(){ QR_STATE="done"; QR_CBS.splice(0).forEach(function(fn){ try{ fn(); }catch(e){} }); };
  document.head.appendChild(sc);
}
function qrDataURL(text){
  if(!window.qrcode || !text) return "";
  try{
    if(qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    var q=qrcode(0,"M"); q.addData(text); q.make(); return q.createDataURL(4,0);
  }catch(e){ return ""; }
}
loadQR();
var DL=null;
if(IN_ARTIFACT){
  window.claude.use("downloads").then(function(d){ DL=d; }).catch(function(){});
}

/* 手机上这三件事都靠不住，只能按环境分流：
   - <a download>：属性存在不代表能下载，安卓会把 blob 地址甩给外部应用
   - print()：微信等内置浏览器里是空操作；系统浏览器里从 iframe 发起也不可靠
   - 兜底文本框：在侧栏里，一开预览层就被整个盖住，点了等于没反应
   所以手机上主推「存为图片 → 长按保存」，这是内置浏览器里唯一稳定的出文件方式。 */
var UA=navigator.userAgent||"";
var IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(UA)
  || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);      // iPadOS 伪装成 Mac
var IN_APP=/MicroMessenger|QQ\/|Weibo|DingTalk|Lark|Feishu|AlipayClient|baiduboxapp|Quark|UCBrowser|aweme|NewsArticle/i.test(UA);
var CAN_DL=("download" in document.createElement("a")) && !IS_MOBILE;

function blobSave(filename,data){
  if(!CAN_DL) return false;
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));
    a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    return true;
  }catch(e){ return false; }
}

function doExport(btn,filename,data){
  var old=btn.textContent;
  function done(msg){ btn.textContent=msg;
    setTimeout(function(){ btn.textContent=old; btn.disabled=false; },2000); }
  if(!DL){
    if(!IN_ARTIFACT && blobSave(filename,data)){ done("已下载"); return; }
    var t=el("fallback"); t.hidden=false; t.value=data; t.focus(); t.select();
    done(CAN_DL ? "已展开，手动复制" : "手机不支持下载，长按复制"); return;
  }
  btn.disabled=true; btn.textContent="等待确认…";
  DL.save({filename:filename,data:data}).then(function(){ done("已保存"); })
    .catch(function(err){
      var c=err&&err.code;
      done(c==="declined"?"已取消":c==="rate_limited"?"稍后再试":"保存失败，改用手动复制");
      if(c!=="declined"&&c!=="rate_limited"){
        var t=el("fallback"); t.hidden=false; t.value=data; t.select();
      }
    });
}

/* ═══════════════ 内测：版本、首次引导、反馈 ═══════════════
   数据只存本机，我们看不到任何人怎么用——出错只能靠使用者告诉我们。
   所以反馈要做到点一下就带上该带的：版本、设备、那条结论、公告原文。
   不带姓名、电话、学校、照片；附带内容摊开给使用者看、能删改，由他自己发出去。 */
var APP_VER="0.9", APP_BUILD="09-15 11:11";     // APP_BUILD 由 build_standalone.py 打包时写入
var FEEDBACK_URL="";                     // 建好问卷后填链接；空着就只走「复制 → 发微信」
var FB_TYPES=[["judge","判定不对"],["parse","公告识别错了"],["export","简历 / 存图有问题"],
              ["stuck","看不懂、卡住了"],["idea","其他建议"]];
var FB_PH={judge:"哪一条判错了？按公告原文应该是怎样？",
  parse:"哪一项识别错了、漏了？原文是怎么写的？",
  export:"点了哪个按钮，出现了什么？",
  stuck:"卡在哪一组、哪一项？",
  idea:"想加什么、改什么？"};
var JOB_FIELD={name:"岗位名称",city:"地区",edu:"学历",degreeReq:"学位",normalReq:"师范类",partyReq:"政治面貌",
  hukouReq:"户籍 / 生源",majors:"专业范围",tzSubject:"教资",athLevel:"运动员等级",athDisc:"等级项目",
  mandarin:"普通话",ageMax:"年龄上限",other:"其他条款"};

function verText(){ return "v"+APP_VER+(APP_BUILD==="dev" ? " · 开发预览" : " · "+APP_BUILD+" 版"); }

function deviceInfo(ua){
  ua=ua||UA;
  var os = /iPhone|iPod/.test(ua) ? "iPhone"
    : /iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1) ? "iPad"
    : /HarmonyOS|OpenHarmony/i.test(ua) ? "鸿蒙"
    : /Android/.test(ua) ? "安卓"
    : /Macintosh/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "其他系统";
  var iv=ua.match(/OS (\d+)[_.](\d+)/), av=ua.match(/Android ([\d.]+)/),
      md=ua.match(/Android [\d.]+; (?:HarmonyOS; )?([^;)]+?)(?: Build\/[^;)]*)?[;)]/);
  if(/iPhone|iPad/.test(os) && iv) os+=" iOS "+iv[1]+"."+iv[2];
  else if(av) os+=" "+av[1]+(md && !/^(K|wv)$/.test(md[1]) ? "（"+md[1]+"）" : "");
  var wx=ua.match(/MicroMessenger\/([\d.]+)/);
  var app = wx ? "微信 "+wx[1] : /QQ\//.test(ua) ? "QQ 内" : IN_APP ? "App 内置浏览器" : "浏览器";
  return os+" · "+app+" · 屏宽 "+(document.documentElement.clientWidth||window.innerWidth);
}

function fbContext(kind,arg){
  var L=["专业方向："+(DISC[S.discipline] ? DISC[S.discipline].name : "未选")];
  if(kind==="job"){
    var j=S.jobs[arg]; if(!j) return L.join("\n");
    var r=matchJob(j);
    L.push("岗位："+([j.name,j.city].filter(Boolean).join(" · ")||"（未填名称）"));
    L.push("工具结论："+VERDICT[r.verdict][1]);
    r.rows.forEach(function(x){ L.push("　"+{ok:"过",no:"卡",fix:"可补",ask:"待核"}[x.s]+"｜"+x.t); });
    L.push("岗位各项：");
    Object.keys(JOB_FIELD).forEach(function(k){ L.push("　"+JOB_FIELD[k]+"："+(j[k]||"（空）")); });
    if(j.hukouReq==="有限制") L.push("　是否符合户籍 / 生源："+(j.hukouOk||"未选"));
    if(j.auto && j.auto.length)
      L.push("还没核对的识别项："+j.auto.map(function(k){ return JOB_FIELD[k]||k; }).join("、"));
    if(j.src){
      var s=String(j.src);
      L.push("公告原文：\n"+(s.length>3000 ? s.slice(0,3000)+"\n…（原文太长，后面截掉了）" : s));
    } else L.push("（手动填的岗位，没有粘贴原文）");
  } else if(kind==="export"){
    L.push("在导出："+arg.doc, "图片生成了吗："+(arg.img ? "生成了" : "还没有"), "当时的提示："+arg.tip);
  } else {
    var gaps=required();
    L.push("还是示例数据吗："+(S.isExample ? "是" : "否"));
    L.push("必填还差："+gaps.length+" 项"+(gaps.length ? "（"+gaps.slice(0,6).map(function(x){ return x.t; }).join("、")+(gaps.length>6 ? "…" : "")+"）" : ""));
    L.push("岗位数："+S.jobs.length);
  }
  return L.join("\n");
}

/* 微信内置浏览器里 navigator.clipboard 常常不可用，先走 execCommand（要在点击的同一拍里同步执行）。
   iOS 上临时文本框必须能被选中：选之前设 readonly，防止弹键盘。 */
function copyText(text){
  var ta=document.createElement("textarea"), ok=false;
  ta.value=text; ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:-9999px;font-size:12pt;border:0;padding:0;margin:0";
  document.body.appendChild(ta);
  try{ ta.select(); ta.setSelectionRange(0,ta.value.length); ok=document.execCommand("copy"); }catch(e){}
  ta.parentNode.removeChild(ta);
  if(ok || !(navigator.clipboard && window.isSecureContext)) return Promise.resolve(ok);
  return navigator.clipboard.writeText(text).then(function(){ return true; },function(){ return false; });
}

function openDlg(title,body,foot,onAct){
  var prevFocus=document.activeElement, prevOv=document.body.style.overflow;
  var d=document.createElement("div");
  d.className="dlg"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.setAttribute("aria-labelledby","dlgT");
  d.innerHTML='<div class="dlg-box" tabindex="-1"><div class="dlg-hd"><b id="dlgT">'+esc(title)+'</b>'+
    '<button type="button" class="dlg-x" data-dlg="close" aria-label="关闭">×</button></div>'+
    '<div class="dlg-bd">'+body+'</div><div class="dlg-ft">'+foot+'</div></div>';
  document.body.appendChild(d); document.body.style.overflow="hidden";
  function key(e){ if(e.key==="Escape") close(); }
  function close(){
    if(!d.parentNode) return;
    d.parentNode.removeChild(d); document.removeEventListener("keydown",key);
    document.body.style.overflow=prevOv;
    try{ if(prevFocus && prevFocus.focus) prevFocus.focus(); }catch(e){}
  }
  document.addEventListener("keydown",key);
  // 不响应点遮罩关闭：写了半天的反馈，手一滑就没了
  d.addEventListener("click",function(e){
    var b=e.target.closest("[data-dlg]"); if(!b) return;
    var a=b.getAttribute("data-dlg");
    if(a==="close"){ close(); return; }
    if(onAct) onAct(a,b,d,close);
  });
  d.querySelector(".dlg-box").focus();
  return {el:d, close:close};
}

  var cur=type;
  var body=
    '<p class="dlg-lead">写清楚哪里不对，点「复制反馈」，再回微信粘贴，发到内测群或发给邀请你的人。</p>'+

    '<details><summary>会一起附上的信息（可删改，不含姓名、电话、学校）</summary>'+
      '<textarea id="fbCtx" aria-label="会一起附上的信息">'+

    (FEEDBACK_URL ? '<a class="btn ghost" href="'+esc(FEEDBACK_URL)+'" target="_blank" rel="noopener">填反馈问卷</a>' : '')+
    '<button type="button" class="btn ghost" data-dlg="close">关闭</button>';
  var dlg=openDlg("反馈问题",body,foot,function(a,b,d){
    var msg=d.querySelector("#fbMsg"), txt=d.querySelector("#fbText");
    if(a==="type"){
      cur=b.getAttribute("data-t");
      [].forEach.call(d.querySelectorAll('[data-dlg="type"]'),function(x){ x.setAttribute("aria-pressed",String(x===b)); });
      txt.placeholder=FB_PH[cur]; return;
    }
    if(a!=="copy") return;
    var said=txt.value.trim();
    if(!said){ msg.className="fb-msg bad"; msg.textContent="先写一句哪里不对，再复制。"; txt.focus(); return; }
    var name="未选"; FB_TYPES.forEach(function(t){ if(t[0]===cur) name=t[1]; });
    var all="【入场券 · 内测反馈】\n类型："+name+"\n说明："+said+"\n—— 附带信息 ——\n"+d.querySelector("#fbCtx").value.trim();
    copyText(all).then(function(ok){
      if(ok){
        msg.className="fb-msg"; msg.textContent="已复制。回微信粘贴，发到内测群或发给邀请你的人。";
        b.textContent="已复制"; return;
      }
      msg.className="fb-msg bad";
      msg.innerHTML="这里不让自动复制。<b>长按下面的文字 → 全选 → 复制</b>，再发到微信。";
      var t=d.querySelector("#fbAll");
      if(!t){ t=document.createElement("textarea"); t.id="fbAll"; t.readOnly=true;
              t.setAttribute("aria-label","反馈全文"); msg.parentNode.appendChild(t); }
      t.value=all; t.scrollIntoView({block:"nearest"}); t.focus(); t.select();
    });
  });
  if(!IS_MOBILE) dlg.el.querySelector("#fbText").focus();   // 手机上自动聚焦会弹键盘盖住选项
}

/* html2canvas 不认 object-fit：手机上「存为图片」那条路会把校徽直接拉满整个框。
   所以简历里不靠 object-fit，改成按长宽比算出确切宽高。旧草稿里没存比例的，启动时量一次。 */
function measureLogo(){
  if(!S.edu.logo || S.edu.logoR) return;
  var im=new Image();
  im.onload=function(){
    if(im.naturalWidth && im.naturalHeight){ S.edu.logoR=im.naturalWidth/im.naturalHeight; save(); }
  };
  im.src=S.edu.logo;
}

function initBeta(){
  var v=el("betaVer"); if(v) v.textContent=verText();
  measureLogo();
  logoLib(function(lib){ if(lib) renderForm(); });
  var seen=null; try{ seen=localStorage.getItem("zgzc.intro"); }catch(e){}
  if(seen!==APP_VER){ try{ localStorage.setItem("zgzc.intro",APP_VER); }catch(e){} openIntro(); }
}

var PRINT_MODE = !IN_ARTIFACT && /[?&]print=resume(&|$)/.test(location.search);
// 打印页一打开就要生成简历，展示页二维码得等库加载完
if(PRINT_MODE){ if(S.me&&S.me.showcase&&!window.qrcode) loadQR(openPrintPage); else openPrintPage(); }
else { renderAll(); initBeta(); }
</script>
